<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetTrack Dashboard</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.0.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.0.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"></link>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
        }
        
        .card-hover:hover {
            transform: translateY(-2px);
            transition: transform 0.2s ease-in-out;
        }
        
        .live-indicator {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .chart-container {
            position: relative;
            height: 200px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Mock data for demonstration
        const mockVehicles = [
            { id: 1, plate: 'ABC123', status: 'moving', battery: 85, lastUpdate: '2 min ago' },
            { id: 2, plate: 'XYZ789', status: 'stopped', battery: 72, lastUpdate: '1 min ago' },
            { id: 3, plate: 'DEF456', status: 'idle', battery: 91, lastUpdate: '30 sec ago' },
            { id: 4, plate: 'GHI789', status: 'no_connection', battery: 0, lastUpdate: '5 min ago' },
            { id: 5, plate: 'JKL012', status: 'moving', battery: 68, lastUpdate: '45 sec ago' },
        ];

        const mockMaintenance = [
            { id: 1, vehicleId: 1, service: 'Oil Change', dueDate: 'Today', priority: 'high' },
            { id: 2, vehicleId: 2, service: 'Tire Rotation', dueDate: 'Oct 28', priority: 'medium' },
            { id: 3, vehicleId: 3, service: 'Brake Inspection', dueDate: 'Nov 5', priority: 'low' },
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [selectedVehicle, setSelectedVehicle] = useState(null);
            const [isRefreshing, setIsRefreshing] = useState(true);

            // Initialize map after component mounts
            useEffect(() => {
                const map = L.map('map').setView([51.505, -0.09], 13);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(map);

                // Add vehicle markers
                mockVehicles.forEach(vehicle => {
                    const color = vehicle.status === 'moving' ? 'green' : 
                                 vehicle.status === 'stopped' ? 'yellow' : 
                                 vehicle.status === 'idle' ? 'orange' : 'red';
                    
                    L.circleMarker([51.505 + Math.random()*0.02, -0.09 + Math.random()*0.02], {
                        radius: 8,
                        fillColor: color,
                        color: '#fff',
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).bindPopup(`
                        <strong>${vehicle.plate}</strong><br/>
                        Status: ${vehicle.status}<br/>
                        Battery: ${vehicle.battery}%<br/>
                        Last Update: ${vehicle.lastUpdate}
                    `).addTo(map);
                });

                return () => map.remove();
            }, []);

            // Initialize charts
            useEffect(() => {
                const statusCtx = document.getElementById('statusChart').getContext('2d');
                new Chart(statusCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Moving', 'Stopped', 'Idle', 'No Connection'],
                        datasets: [{
                            data: [70, 20, 7, 3],
                            backgroundColor: ['#10B981', '#F59E0B', '#F97316', '#EF4444']
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                });
            }, []);

            const handleExport = (format) => {
                alert(`Exporting data to ${format}...`);
                // Actual implementation would trigger file download
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-white shadow-sm border-b">
                        <div className="container mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-2">
                                <i className="fas fa-truck text-blue-600 text-xl"></i>
                                <h1 className="text-xl font-bold text-gray-800">FleetTrack</h1>
                            </div>
                            <div className="flex items-center space-x-4">
                                <button className="text-gray-600 hover:text-gray-800">
                                    <i className="fas fa-search"></i>
                                </button>
                                <button className="text-gray-600 hover:text-gray-800">
                                    <i className="fas fa-user-circle"></i>
                                </button>
                                <button className="text-gray-600 hover:text-gray-800">
                                    <i className="fas fa-cog"></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <nav className="bg-white border-b">
                        <div className="container mx-auto px-4">
                            <ul className="flex space-x-8">
                                <li>
                                    <button 
                                        onClick={() => setActiveTab('dashboard')}
                                        className={`py-4 px-2 font-medium ${activeTab === 'dashboard' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                                    >
                                        Dashboard
                                    </button>
                                </li>
                                <li>
                                    <button 
                                        onClick={() => setActiveTab('maintenance')}
                                        className={`py-4 px-2 font-medium ${activeTab === 'maintenance' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                                    >
                                        Maintenance
                                    </button>
                                </li>
                                <li>
                                    <button 
                                        onClick={() => setActiveTab('analytics')}
                                        className={`py-4 px-2 font-medium ${activeTab === 'analytics' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                                    >
                                        Analytics
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="flex-grow container mx-auto px-4 py-6">
                        {/* KPI Cards Row */}
                        <div className="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">
                            <div className="bg-white rounded-lg shadow p-4 card-hover">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <p className="text-sm text-gray-600">Total Vehicles</p>
                                        <h3 className="text-2xl font-bold text-gray-800">127</h3>
                                    </div>
                                    <div className="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
                                        <i className="fas fa-car text-blue-600"></i>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="bg-white rounded-lg shadow p-4 card-hover">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <p className="text-sm text-gray-600">Active</p>
                                        <h3 className="text-2xl font-bold text-green-600">89</h3>
                                    </div>
                                    <div className="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center">
                                        <i className="fas fa-play text-green-600"></i>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="bg-white rounded-lg shadow p-4 card-hover">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <p className="text-sm text-gray-600">Stopped</p>
                                        <h3 className="text-2xl font-bold text-yellow-600">22</h3>
                                    </div>
                                    <div className="w-10 h-10 bg-yellow-100 rounded-full flex items-center justify-center">
                                        <i className="fas fa-pause text-yellow-600"></i>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="bg-white rounded-lg shadow p-4 card-hover">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <p className="text-sm text-gray-600">No Connection</p>
                                        <h3 className="text-2xl font-bold text-red-600">5</h3>
                                    </div>
                                    <div className="w-10 h-10 bg-red-100 rounded-full flex items-center justify-center">
                                        <i className="fas fa-times text-red-600"></i>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="bg-white rounded-lg shadow p-4 card-hover">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <p className="text-sm text-gray-600">Avg. Battery</p>
                                        <h3 className="text-2xl font-bold text-gray-800">78%</h3>
                                    </div>
                                    <div className="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center">
                                        <i className="fas fa-battery-three-quarters text-purple-600"></i>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Map Section */}
                        <div className="bg-white rounded-lg shadow mb-6">
                            <div className="p-4 border-b">
                                <h2 className="text-lg font-semibold text-gray-800">Live Vehicle Locations</h2>
                            </div>
                            <div id="map" style={{height: '400px'}}></div>
                        </div>

                        {/* Status Panel & Analytics Row */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                            {/* Status Panel */}
                            <div className="bg-white rounded-lg shadow">
                                <div className="p-4 border-b">
                                    <h2 className="text-lg font-semibold text-gray-800">Vehicle Status</h2>
                                </div>
                                <div className="p-4">
                                    <div className="mb-4">
                                        <canvas id="statusChart"></canvas>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="min-w-full divide-y divide-gray-200">
                                            <thead className="bg-gray-50">
                                                <tr>
                                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Vehicle</th>
                                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Update</th>
                                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody className="bg-white divide-y divide-gray-200">
                                                {mockVehicles.map(vehicle => (
                                                    <tr key={vehicle.id}>
                                                        <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{vehicle.plate}</td>
                                                        <td className="px-6 py-4 whitespace-nowrap">
                                                            <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium 
                                                                ${vehicle.status === 'moving' ? 'bg-green-100 text-green-800' :
                                                                  vehicle.status === 'stopped' ? 'bg-yellow-100 text-yellow-800' :
                                                                  vehicle.status === 'idle' ? 'bg-orange-100 text-orange-800' :
                                                                  'bg-red-100 text-red-800'}`}>
                                                                {vehicle.status.replace('_', ' ')}
                                                            </span>
                                                        </td>
                                                        <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{vehicle.lastUpdate}</td>
                                                        <td className="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                                            <button 
                                                                onClick={() => setSelectedVehicle(vehicle)}
                                                                className="text-blue-600 hover:text-blue-900"
                                                            >
                                                                View Details
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>

                            {/* Analytics Preview */}
                            <div className="bg-white rounded-lg shadow">
                                <div className="p-4 border-b">
                                    <h2 className="text-lg font-semibold text-gray-800">Kilometers Driven</h2>
                                </div>
                                <div className="p-4">
                                    <div className="chart-container mb-4">
                                        <canvas id="mileageChart"></canvas>
                                    </div>
                                    <div className="flex justify-end space-x-2">
                                        <button 
                                            onClick={() => handleExport('excel')}
                                            className="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 flex items-center"
                                        >
                                            <i className="fas fa-file-excel mr-2"></i> Export Excel
                                        </button>
                                        <button 
                                            onClick={() => handleExport('pdf')}
                                            className="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 flex items-center"
                                        >
                                            <i className="fas fa-file-pdf mr-2"></i> Export PDF
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Maintenance Schedule (shown when tab selected) */}
                        {activeTab === 'maintenance' && (
                            <div className="bg-white rounded-lg shadow mb-6">
                                <div className="p-4 border-b">
                                    <h2 className="text-lg font-semibold text-gray-800">Maintenance Schedule</h2>
                                </div>
                                <div className="p-4">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {/* Calendar View */}
                                        <div>
                                            <h3 className="font-medium text-gray-700 mb-3">October 2023</h3>
                                            <div className="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-gray-500 mb-2">
                                                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                                            </div>
                                            <div className="grid grid-cols-7 gap-1 text-center">
                                                {[...Array(31)].map((_, i) => (
                                                    <div key={i} className={`p-2 text-sm ${i >= 25 ? 'text-gray-400' : ''} ${i === 25 || i === 27 ? 'bg-red-100 text-red-800 rounded' : ''}`}>
                                                        {i + 1}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Upcoming Services */}
                                        <div>
                                            <h3 className="font-medium text-gray-700 mb-3">Upcoming Services</h3>
                                            <div className="space-y-3">
                                                {mockMaintenance.map(service => (
                                                    <div key={service.id} className="border-l-4 pl-3 py-2" style={{borderColor: service.priority === 'high' ? '#ef4444' : service.priority === 'medium' ? '#f59e0b' : '#10b981'}}>
                                                        <div className="flex justify-between items-start">
                                                            <div>
                                                                <p className="font-medium text-gray-800">{service.service}</p>
                                                                <p className="text-sm text-gray-500">Vehicle: {mockVehicles.find(v => v.id === service.vehicleId)?.plate}</p>
                                                            </div>
                                                            <span className={`px-2 py-1 text-xs rounded-full ${service.priority === 'high' ? 'bg-red-100 text-red-800' : service.priority === 'medium' ? 'bg-yellow-100 text-yellow-800' : 'bg-green-100 text-green-800'}`}>
                                                                {service.dueDate}
                                                            </span>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t mt-auto">
                        <div className="container mx-auto px-4 py-4 flex justify-between items-center text-sm text-gray-600">
                            <div>© 2023 FleetTrack. All rights reserved.</div>
                            <div className="flex items-center space-x-4">
                                <span className="flex items-center">
                                    <span className={`w-2 h-2 rounded-full bg-green-500 mr-2 live-indicator`}></span>
                                    Live Updates
                                </span>
                                <a href="#" className="hover:text-gray-800">Help</a>
                                <a href="#" className="hover:text-gray-800">Privacy Policy</a>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
